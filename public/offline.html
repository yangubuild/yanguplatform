<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YANGU — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #050a07;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 380px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #999;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #D4952B, #F4A83D);
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="container">
    <img src="/yangu-y-loader.png" alt="YANGU" class="icon" />
    <h1>You're offline</h1>
    <p>YANGU needs an internet connection to work. Check your connection and try again.</p>
    <button id="retry" type="button">Retry</button>
  </div>
  <script>
    var btn = document.getElementById('retry');
    btn.addEventListener('click', function () {
      btn.disabled = true;
      btn.textContent = 'Retrying...';
      // Go back to the app root over the network rather than reloading the
      // cached offline document (a plain reload can re-serve this page).
      fetch('/?offline-retry=' + Date.now(), { cache: 'reload' })
        .then(function () { window.location.replace('/'); })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Retry';
        });
    });
    window.addEventListener('online', function () { window.location.replace('/'); });
  </script>
</body>
</html>
